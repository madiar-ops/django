{% extends "layout/base.html" %}
{% block title %}Логин{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Вход</h2>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember">Запомнить</label>
            </div>
            <a href="#" class="link-secondary small">Забыли пароль?</a>
          </div>

          <button class="btn btn-primary w-100" type="submit">Войти</button>
        </form>

        <div class="text-center mt-3">
          <a class="small" href="{% url 'home' %}">Назад на домашнюю</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
